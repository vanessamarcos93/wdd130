<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting to ask questions, book your next rafting adventure, or learn more about our trips and services.">
    <meta name="author" content="Vanessa Marcos">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>White Water Rafting Company</h1>

        <section class="contact-info">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 (999) 999-9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-grid">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m12!1m8!1m3!1d62203.7381079185!2d-76.1410657!3d-12.9888813!3m2!1i1024!2i768!4f13.1!2m1!1slunahuana%20kayak%20ubicacion!5e0!3m2!1sen!2spe!4v1785351247887!5m2!1sen!2spe"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>


            <form action="#" method="post">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <div>
                        <input type="radio" name="purpose" value="general" required>
                        <label> General Inquiry </label>
                    </div>

                    <div>
                        <input type="radio" name="purpose" value="reservation">
                        <label> Reservation Question </label>
                    </div>

                    <div>
                        <input type="radio" name="purpose" value="suggestion">
                        <label> Website Suggestion </label>
                    </div>


                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <div class="checkbox-newsletter">
                    <input type="checkbox" name="newsletter">
                    <label class="newsletter"> Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>

            </form>


        </section>


        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employees-pictures">
                <figure>
                    <img src="images/employee1.jpg" alt="Raft Guide">
                    <figcaption>Raft Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Trip Leader">
                    <figcaption>Trip Leader</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Safety Kayaker">
                    <figcaption>Safety Kayaker</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>

        <p> © 2026 White Water Rafting Company | Vanessa Marcos </p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="Linkedin">
            </a>
        </nav>

    </footer>


</body>

</html>
